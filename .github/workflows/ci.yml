name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          # The runner image ships Microsoft's apt sources. Nothing here installs
          # from them, but an outage there fails "apt-get update".
          sources=$(grep -rl packages.microsoft.com \
            /etc/apt/sources.list /etc/apt/sources.list.d || true)
          if [ -n "$sources" ]; then
            echo "Removing apt sources:" $sources
            sudo rm -f $sources
          fi
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Unit tests (AddressSanitizer + UBSan)
        run: make test-asan

      - name: Unit tests (ThreadSanitizer)
        run: make test-tsan

      - name: Headless smoke test
        run: make smoke
