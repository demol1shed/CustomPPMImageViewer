name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Unit tests (AddressSanitizer + UBSan)
        run: make test-asan

      - name: Unit tests (ThreadSanitizer)
        run: make test-tsan

      - name: Headless smoke test
        run: make smoke
